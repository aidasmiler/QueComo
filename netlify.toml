# Netlify only builds and serves the static Vite output. No Netlify-specific runtime features are
# used, so dist/ can be hosted on any static provider (see docs/deployment/NETLIFY.md).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Supabase URL and publishable key are public by design (RLS protects the data), so they are
# versioned here. Previews and branch deploys ALWAYS use the test project; production gets its own
# project once it exists (until then production builds show the "missing configuration" screen).
[context.production.environment]
  VITE_APP_ENV = "production"

[context.deploy-preview.environment]
  VITE_APP_ENV = "preview"
  VITE_SUPABASE_URL = "https://hbdcxaynxkaidqdsqdqv.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1vrJwn3pz_ByTUvpcwF0iA_86SmJJ5I"

[context.branch-deploy.environment]
  VITE_APP_ENV = "preview"
  VITE_SUPABASE_URL = "https://hbdcxaynxkaidqdsqdqv.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1vrJwn3pz_ByTUvpcwF0iA_86SmJJ5I"

# SPA fallback for React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
