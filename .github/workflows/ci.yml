name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public values of the TEST Supabase project (safe to expose; RLS protects data).
  VITE_SUPABASE_URL: https://hbdcxaynxkaidqdsqdqv.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1vrJwn3pz_ByTUvpcwF0iA_86SmJJ5I
  VITE_APP_ENV: preview

jobs:
  quality:
    name: Lint, types, translations, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm run docs:check
      - run: npm run test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Backend-dependent suites are skipped unless E2E_BACKEND=1 (they create users in the test project).
      - run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
